filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /usr/share/filebeat/logs/application.log   # путь внутри контейнера
    json.keys_under_root: true
    json.add_error_key: true
    # Если нужно, можно указать поле с временем
    #json.message_key: message

output.logstash:
  hosts: ["logstash:5044"]